<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD0FF"/>
      <stop offset="55%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1F6FEB" opacity="0.35"/>
    </pattern>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="12%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="88%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="1198" height="298" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- base -->
    <rect width="1200" height="300" fill="#0D1117"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#edgeFade)"/>
    <circle cx="900" cy="150" r="230" fill="url(#glow)"/>

    <!-- ================= LEFT: identity ================= -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
      <text x="64" y="78" font-size="15" fill="#58A6FF" letter-spacing="1">// full-stack developer</text>

      <text x="62" y="142" font-size="58" font-weight="700" fill="url(#titleGrad)">Miquella</text>

      <text x="64" y="182" font-size="15" fill="#3D4B5E">&lt;/&gt;</text>
      <text x="98" y="182" font-size="15" fill="#8FA9C9">system architecture · REST APIs · database design</text>

      <!-- terminal line -->
      <rect x="62" y="208" width="470" height="30" rx="6" fill="#111826" stroke="#1B2430"/>
      <text x="76" y="228" font-size="13" fill="#4E9BFF">$</text>
      <text x="94" y="228" font-size="13" fill="#B9C6D8">status --watch</text>
      <text x="222" y="228" font-size="13" fill="#3FB950">building TheraMotion</text>
      <rect x="382" y="216" width="8" height="14" fill="#58A6FF">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ================= RIGHT: request pipeline signature ================= -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
      <!-- connecting line -->
      <path id="pipe" d="M 700 150 L 830 150 L 960 150 L 1090 150" stroke="#1F2A3B" stroke-width="2" fill="none"/>

      <!-- travelling packets -->
      <circle r="4" fill="#58A6FF">
        <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s" path="M 700 150 L 830 150 L 960 150 L 1090 150"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#2F81F7">
        <animateMotion dur="2.6s" repeatCount="indefinite" begin="0.9s" path="M 700 150 L 830 150 L 960 150 L 1090 150"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.6s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <circle r="4" fill="#8FD0FF">
        <animateMotion dur="2.6s" repeatCount="indefinite" begin="1.8s" path="M 700 150 L 830 150 L 960 150 L 1090 150"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.6s" repeatCount="indefinite" begin="1.8s"/>
      </circle>

      <!-- node: request -->
      <circle cx="700" cy="150" r="22" fill="#111826" stroke="#2A3644" stroke-width="1.5"/>
      <text x="700" y="155" font-size="13" fill="#58A6FF" text-anchor="middle">&gt;_</text>
      <text x="700" y="196" font-size="10.5" fill="#5C6B7E" text-anchor="middle" letter-spacing="1.5">REQUEST</text>

      <!-- node: auth (lock) -->
      <rect x="808" y="128" width="44" height="44" rx="10" fill="#111826" stroke="#2A3644" stroke-width="1.5"/>
      <path d="M823 148 h14 a2 2 0 0 1 2 2 v10 a2 2 0 0 1 -2 2 h-14 a2 2 0 0 1 -2 -2 v-10 a2 2 0 0 1 2 -2 Z" fill="none" stroke="#A371F7" stroke-width="1.6"/>
      <path d="M826 148 v-5 a4 4 0 0 1 8 0 v5" fill="none" stroke="#A371F7" stroke-width="1.6"/>
      <circle cx="830" cy="156" r="1.6" fill="#A371F7"/>
      <text x="830" y="196" font-size="10.5" fill="#5C6B7E" text-anchor="middle" letter-spacing="1.5">AUTH</text>

      <!-- node: middleware -->
      <rect x="938" y="128" width="44" height="44" rx="10" fill="#111826" stroke="#2A3644" stroke-width="1.5"/>
      <text x="960" y="156" font-size="17" fill="#2F81F7" text-anchor="middle">{ }</text>
      <text x="960" y="196" font-size="10.5" fill="#5C6B7E" text-anchor="middle" letter-spacing="1.5">MIDDLEWARE</text>

      <!-- node: database -->
      <g stroke="#3FB950" stroke-width="1.6" fill="#111826">
        <ellipse cx="1090" cy="136" rx="20" ry="7"/>
        <path d="M1070 136 L1070 164 A20 7 0 0 0 1110 164 L1110 136" />
        <path d="M1070 150 A20 7 0 0 0 1110 150" fill="none"/>
      </g>
      <text x="1090" y="196" font-size="10.5" fill="#5C6B7E" text-anchor="middle" letter-spacing="1.5">DATABASE</text>
    </g>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#1B2430" stroke-width="1.5"/>
  </g>
</svg>
